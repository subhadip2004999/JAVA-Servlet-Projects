<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Application by Subhadip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Uses your local 566396.jpg with a dark overlay blend for crisp readability */
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 58, 138, 0.75)),
                url('566396.jpg') no-repeat center center/cover;
    color: #ffffff;
    padding: 20px;
  }

  .hero-card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 28px;
    padding: 48px 40px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
    text-align: center;
    animation: fadeIn 0.8s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .weather-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 24px;
    text-transform: uppercase;
  }

  .weather-badge svg {
    width: 16px;
    height: 16px;
    fill: #f59e0b;
  }

  .hero-card h1 {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
  }

  .hero-card p {
    font-size: 1rem;
    color: rgba(255, 255, 255, 0.8);
    font-weight: 400;
    line-height: 1.5;
    margin-bottom: 32px;
  }

  .search-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .input-group {
    position: relative;
    width: 100%;
  }

  .input-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    stroke: rgba(255, 255, 255, 0.6);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    padding: 16px 20px 16px 50px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    font-size: 1rem;
    color: #ffffff;
    outline: none;
    transition: all 0.3s ease;
  }

  .search-input::placeholder {
    color: rgba(255, 255, 255, 0.55);
  }

  .search-input:focus {
    background: rgba(255, 255, 255, 0.25);
    border-color: rgba(255, 255, 255, 0.6);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
  }

  .search-btn {
    width: 100%;
    padding: 16px;
    background: #3b82f6;
    border: none;
    border-radius: 16px;
    font-size: 1rem;
    font-weight: 600;
    color: #ffffff;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
  }

  .search-btn:hover {
    background: #2563eb;
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(59, 130, 246, 0.5);
  }

  .search-btn:active {
    transform: translateY(0);
  }
</style>
</head>
<body>

  <div class="hero-card">
    <div class="weather-badge">
      <svg viewBox="0 0 24 24">
        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/>
        <path d="M12 6a6 6 0 1 0 6 6 6 6 0 0 0-6-6z"/>
      </svg>
      Live Weather
    </div>

    <h1>Search Weather</h1>
    <p>Enter any city name below to get real-time temperature, humidity, and atmospheric conditions.</p>

    <!-- Connects seamlessly to your existing 'servlet' endpoint -->
    <form class="search-form" action="MyServlet" method="Post">
      <div class="input-group">
        <svg class="input-icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          class="search-input" 
          name="userInput" 
          placeholder="e.g. Kolkata, London, Tokyo..." 
          required 
          autocomplete="off"
          autofocus
        />
      </div>

      <button type="submit" class="search-btn">Check Weather</button>
    </form>
  </div>

</body>
</html>
